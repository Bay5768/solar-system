<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 移动端检测:触屏指针 + 屏幕较小(手机竖屏/横屏),据此降分辨率、默认关光晕 */
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const IS_MOBILE = IS_TOUCH && Math.min(innerWidth, innerHeight) < 820;

/* ---------------- 工具:随机数与分形噪声 ---------------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// 周期性值噪声(横向可无缝平铺,G 为周期),叠加成 fbm
function makeFbm(seed, G) {
  const rand = mulberry32(seed);
  const grid = new Float32Array(G * G);
  for (let i = 0; i < G * G; i++) grid[i] = rand();
  const sm = t => t * t * (3 - 2 * t);
  function noise(x, y) {
    x = ((x % G) + G) % G; y = ((y % G) + G) % G;
    const xi = x | 0, yi = y | 0, xf = x - xi, yf = y - yi;
    const x1 = (xi + 1) % G, y1 = (yi + 1) % G;
    const v00 = grid[yi * G + xi], v10 = grid[yi * G + x1];
    const v01 = grid[y1 * G + xi], v11 = grid[y1 * G + x1];
    const u = sm(xf), v = sm(yf);
    return v00 * (1 - u) * (1 - v) + v10 * u * (1 - v) + v01 * (1 - u) * v + v11 * u * v;
  }
  return (x, y, oct = 4) => {
    let val = 0, amp = 0.5, f = 1, tot = 0;
    for (let o = 0; o < oct; o++) { val += amp * noise(x * f, y * f); tot += amp; amp *= 0.5; f *= 2; }
    return val / tot;
  };
}
const hexToRgb = h => [(h >> 16) & 255, (h >> 8) & 255, h & 255];
const mixRgb = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp01 = x => Math.min(1, Math.max(0, x));
const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };

/* ---------------- 程序化贴图 ---------------- */
function buildSurface(w, h, fn) { // fn(u,v) -> [r,g,b]
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h), d = img.data;
  let i = 0;
  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const c = fn(x / w, v);
      d[i++] = c[0]; d[i++] = c[1]; d[i++] = c[2]; d[i++] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { canvas, ctx };
}
function toTexture(canvas) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  t.wrapS = THREE.RepeatWrapping;
  return t;
}
function drawPoles(ctx, w, h, strength) {
  const g1 = ctx.createLinearGradient(0, 0, 0, h * 0.16);
  g1.addColorStop(0, `rgba(245,248,252,${strength})`); g1.addColorStop(1, 'rgba(245,248,252,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, w, h * 0.16);
  const g2 = ctx.createLinearGradient(0, h * 0.84, 0, h);
  g2.addColorStop(0, 'rgba(245,248,252,0)'); g2.addColorStop(1, `rgba(245,248,252,${strength})`);
  ctx.fillStyle = g2; ctx.fillRect(0, h * 0.84, w, h * 0.16);
}
function drawCraters(ctx, w, h, count, seed) {
  const rand = mulberry32(seed + 7);
  for (let i = 0; i < count; i++) {
    const cx = rand() * w, cy = h * 0.06 + rand() * h * 0.88, cr = 1.5 + rand() * rand() * 9;
    ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,0,0,${0.08 + rand() * 0.15})`; ctx.fill();
    ctx.beginPath(); ctx.arc(cx - cr * 0.25, cy - cr * 0.25, cr * 0.7, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.04 + rand() * 0.08})`; ctx.fill();
  }
}
// 气态行星:横向条纹 + 噪声扰动,可选大红斑
function bandsTexture(seed, palette, opts = {}) {
  const { bands = 9, warp = 0.05, grain = 0.14, poles = 0, spot = null } = opts;
  const w = 1024, h = 512;
  const fbm = makeFbm(seed, 32);
  const cols = palette.map(hexToRgb);
  const { canvas, ctx } = buildSurface(w, h, (u, v) => {
    const wv = (fbm(u * 32, v * 16, 4) - 0.5) * warp;
    const f = (v + wv) * bands;
    const i = Math.floor(f), fr = f - i;
    const n = ((i % cols.length) + cols.length) % cols.length;
    const c0 = cols[n], c1 = cols[(n + 1) % cols.length];
    const s = fr * fr * (3 - 2 * fr);
    const g = 1 + (fbm(u * 128, v * 64, 2) - 0.5) * grain;
    return [(c0[0] + (c1[0] - c0[0]) * s) * g, (c0[1] + (c1[1] - c0[1]) * s) * g, (c0[2] + (c1[2] - c0[2]) * s) * g];
  });
  if (spot) {
    const { x = 0.68, y = 0.63, rx = 0.055, ry = 0.028, color = '#c25436' } = spot;
    ctx.save(); ctx.translate(x * w, y * h); ctx.scale(rx * w, ry * h);
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.globalAlpha = 0.85; ctx.fill();
    ctx.globalAlpha = 0.4; ctx.lineWidth = 0.25;
    ctx.strokeStyle = 'rgba(255,235,210,0.8)'; ctx.stroke();
    ctx.restore();
  }
  if (poles > 0) drawPoles(ctx, w, h, poles);
  return toTexture(canvas);
}
// 岩石行星:噪声混色 + 陨石坑 + 极冠
function rockyTexture(seed, base, dark, opts = {}) {
  const { craters = 90, grain = 0.28, poles = 0 } = opts;
  const w = 1024, h = 512;
  const fbm = makeFbm(seed, 16);
  const cb = hexToRgb(base), cd = hexToRgb(dark);
  const { canvas, ctx } = buildSurface(w, h, (u, v) => {
    const n = fbm(u * 16, v * 8, 5);
    const g = 1 + (fbm(u * 64, v * 32, 3) - 0.5) * grain;
    let col = [cb[0] + (cd[0] - cb[0]) * n, cb[1] + (cd[1] - cb[1]) * n, cb[2] + (cd[2] - cb[2]) * n];
    if (poles > 0) col = mixRgb(col, [245, 248, 250], sstep(poles, 0.5, Math.abs(v - 0.5)) * 0.9);
    return [col[0] * g, col[1] * g, col[2] * g];
  });
  drawCraters(ctx, w, h, craters, seed);
  return toTexture(canvas);
}
// 地球:海洋 + 大陆 + 冰盖,另附云层灰度图(作 alphaMap)
function earthTextures() {
  const w = 1024, h = 512;
  const cont = makeFbm(42, 6), det = makeFbm(77, 32);
  const o1 = hexToRgb(0x0d3b73), o2 = hexToRgb(0x1e63a8);
  const l1 = hexToRgb(0x3f7a37), l2 = hexToRgb(0x8a7d4a), l3 = hexToRgb(0x6b8f3f);
  const surf = buildSurface(w, h, (u, v) => {
    const c = cont(u * 6, v * 3, 5), d2 = det(u * 32, v * 16, 3);
    const lat = Math.abs(v - 0.5) * 2;
    const ice = sstep(0.82, 0.93, lat + (d2 - 0.5) * 0.12);
    if (c > 0.52 - (d2 - 0.5) * 0.15) {
      let col = mixRgb(l1, l2, clamp01(lat * 0.9 + d2 * 0.4));
      col = mixRgb(col, l3, d2 * 0.5);
      col = mixRgb(col, [240, 246, 250], ice);
      const g = 0.82 + d2 * 0.36;
      return [col[0] * g, col[1] * g, col[2] * g];
    }
    let col = mixRgb(o1, o2, clamp01((0.52 - c) * 3 + d2 * 0.3));
    col = mixRgb(col, [228, 240, 248], ice);
    return col;
  });
  const cl = makeFbm(911, 8);
  const cc = document.createElement('canvas'); cc.width = w; cc.height = h;
  const cctx = cc.getContext('2d');
  const img = cctx.createImageData(w, h), d = img.data;
  let i = 0;
  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w;
      const a = sstep(0.52, 0.75, cl(u * 8, v * 4, 4) * 0.8 + cl(u * 32, v * 16, 2) * 0.3);
      d[i++] = a * 255; d[i++] = a * 255; d[i++] = a * 255; d[i++] = 255;
    }
  }
  cctx.putImageData(img, 0, 0);
  return { surface: toTexture(surf.canvas), clouds: toTexture(cc) };
}
function sunTexture() {
  const fbm = makeFbm(5, 16);
  const { canvas } = buildSurface(1024, 512, (u, v) => {
    const n = fbm(u * 16, v * 8, 5), n2 = fbm(u * 64, v * 32, 3);
    const t = clamp01(n * 0.75 + n2 * 0.45);
    return t < 0.5 ? mixRgb([255, 110, 20], [255, 190, 60], t / 0.5)
                   : mixRgb([255, 190, 60], [255, 250, 225], (t - 0.5) / 0.5);
  });
  return toTexture(canvas);
}
function ringTexture() {
  const w = 1024, h = 16;
  const fbm = makeFbm(3, 64);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h), d = img.data;
  for (let x = 0; x < w; x++) {
    const t = x / w;
    let a = 0.55 + 0.45 * fbm(t * 64, 0.5, 4);
    a *= sstep(0, 0.06, t) * (1 - sstep(0.93, 1, t));
    a *= 1 - 0.88 * Math.exp(-Math.pow((t - 0.62) / 0.025, 2));  // 卡西尼缝
    a *= 1 - 0.5 * Math.exp(-Math.pow((t - 0.35) / 0.02, 2));
    const c = mixRgb([206, 186, 148], [238, 224, 192], fbm(t * 32, 0.5, 3));
    for (let y = 0; y < h; y++) {
      const i = (y * w + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = a * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function softDotTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.6)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,225,160,0.85)');
  g.addColorStop(0.25, 'rgba(255,170,70,0.30)');
  g.addColorStop(0.6, 'rgba(255,130,40,0.10)');
  g.addColorStop(1, 'rgba(255,120,30,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

/* ---------------- 行星数据(轨道半径/大小经艺术化压缩) ---------------- */
const distOf = au => 28 * Math.pow(au, 0.55);
const sizeOf = km => 0.9 * Math.sqrt(km / 6371);

const SUN_INFO = {
  name: '太阳', en: 'Sun',
  rows: [['类型', 'G2V 黄矮星'], ['直径', '1,392,700 km'], ['表面温度', '约 5,500 °C'], ['自转周期', '约 25.4 天(赤道)'], ['年龄', '约 46 亿年']],
  fact: '太阳占据太阳系总质量的 99.86%,每秒将约 400 万吨物质转化为能量,照亮整个行星系统。'
};

const PLANET_DEFS = [
  { key: '水星', en: 'Mercury', au: 0.387, period: 87.97, ecc: 0.2056, incl: 7.0, radiusKm: 2440, tilt: 0.03, dayHours: 1407.6, M0: 0.8,
    makeTex: () => rockyTexture(11, 0x9a938c, 0x514c47, { craters: 120 }),
    info: { rows: [['距日', '0.39 AU · 约 5,790 万 km'], ['公转周期', '88 天'], ['自转周期', '58.6 天'], ['直径', '4,879 km'], ['已知卫星', '0']],
            fact: '没有大气调节温度,昼夜温差接近 600 °C,是太阳系温差最大的行星。' } },
  { key: '金星', en: 'Venus', au: 0.723, period: 224.7, ecc: 0.0068, incl: 3.39, radiusKm: 6052, tilt: 177.4, dayHours: -5832.5, M0: 2.4,
    makeTex: () => bandsTexture(21, [0xe8d9a8, 0xd9b878, 0xf0e4c0, 0xcfa96a], { bands: 5, warp: 0.12, grain: 0.1 }),
    info: { rows: [['距日', '0.72 AU · 约 1.08 亿 km'], ['公转周期', '224.7 天'], ['自转周期', '243 天(逆向)'], ['直径', '12,104 km'], ['已知卫星', '0']],
            fact: '浓厚的二氧化碳大气造成失控温室效应,表面约 465 °C,是最热的行星;它还"逆向"自转。' } },
  { key: '地球', en: 'Earth', au: 1.0, period: 365.25, ecc: 0.0167, incl: 0.0, radiusKm: 6371, tilt: 23.4, dayHours: 23.93, M0: 4.4,
    makeTex: () => earthTextures().surface,
    info: { rows: [['距日', '1.00 AU · 约 1.5 亿 km'], ['公转周期', '365.25 天'], ['自转周期', '23.9 小时'], ['直径', '12,756 km'], ['已知卫星', '1']],

            fact: '风速可达 2,100 km/h,拥有太阳系最猛烈的风暴;它是唯一靠数学计算预言后才发现的行星。' } },
];

/* ---------------- 场景基础 ---------------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'absolute', top: '0', left: '0', pointerEvents: 'none', zIndex: '2' });
container.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 6000);
const CAM_DEFAULT = new THREE.Vector3(0, 85, 175);
camera.position.copy(CAM_DEFAULT);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 850;

const composerRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, composerRT);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.05, 0.6, 0.85);
composer.addPass(bloom);

scene.add(new THREE.AmbientLight(0x223344, 0.7));
const sunLight = new THREE.PointLight(0xfff2d8, 2.6, 0, 0);
scene.add(sunLight);

/* ---------------- 太阳 ---------------- */
const dotTex = softDotTexture();
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(6, 64, 32),
  new THREE.MeshBasicMaterial({ map: sunTexture() })
);
sun.material.color.setRGB(1.35, 1.25, 1.1); // 提亮以触发光晕
sun.userData.isSun = true;
scene.add(sun);

const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture(), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
}));
glow.scale.setScalar(34);
scene.add(glow);

function addLabel(parent, text, y) {
  const div = document.createElement('div');
  div.className = 'label';
  div.textContent = text;
  const obj = new CSS2DObject(div);
  obj.position.set(0, y, 0);
  parent.add(obj);
  return obj;
}
const sunLabel = addLabel(sun, '太阳', 8.2);

/* ---------------- 行星 ---------------- */
function solveKepler(Mm, e) {
  let E = Mm;
  for (let i = 0; i < 5; i++) E = E - (E - e * Math.sin(E) - Mm) / (1 - e * Math.cos(E));
  return E;
}
function orbitalPos(def, tDays, out) {
  const TAU = Math.PI * 2;
  const Mm = ((def.M0 + TAU * tDays / def.period) % TAU + TAU) % TAU;
  const E = solveKepler(Mm, def.ecc);
  const a = def.dist, b = a * Math.sqrt(1 - def.ecc * def.ecc), inc = THREE.MathUtils.degToRad(def.incl);
  const x = a * (Math.cos(E) - def.ecc);
  const z = b * Math.sin(E);
  out.set(x, z * Math.sin(inc), z * Math.cos(inc));
}
function makeOrbitLine(def) {
  const pts = [];
  const a = def.dist, b = a * Math.sqrt(1 - def.ecc * def.ecc), inc = THREE.MathUtils.degToRad(def.incl);
  for (let i = 0; i <= 256; i++) {
    const E = i / 256 * Math.PI * 2;
    const z = b * Math.sin(E);
    pts.push(new THREE.Vector3(a * (Math.cos(E) - def.ecc), z * Math.sin(inc), z * Math.cos(inc)));
  }
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x3a5a8a, transparent: true, opacity: 0.5 })
  );
}

const planets = [];
const orbitLines = [];
const labels = [sunLabel];
const clickables = [sun];
const earthTex = earthTextures();

for (const def of PLANET_DEFS) {
  def.dist = distOf(def.au);
  def.size = sizeOf(def.radiusKm);

  const holder = new THREE.Group();
  scene.add(holder);

  const tiltG = new THREE.Group();
  tiltG.rotation.z = THREE.MathUtils.degToRad(def.tilt);
  holder.add(tiltG);

  const tex = def.key === '地球' ? earthTex.surface : def.makeTex();
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(def.size, 48, 24),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 })
  );
  mesh.userData.def = def;
  tiltG.add(mesh);
  clickables.push(mesh);

  if (def.key === '地球') {
    const clouds = new THREE.Mesh(
      new THREE.SphereGeometry(def.size * 1.03, 48, 24),
      new THREE.MeshStandardMaterial({ color: 0xffffff, alphaMap: earthTex.clouds, transparent: true, depthWrite: false, roughness: 1 })
    );
    tiltG.add(clouds);
    def.cloudsMesh = clouds;

    // 月球
    const moonPivot = new THREE.Group();
    holder.add(moonPivot);
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.26, 24, 12),
      new THREE.MeshStandardMaterial({ map: rockyTexture(99, 0xb8b4ae, 0x6e6a64, { craters: 60 }), roughness: 1 })
    );
    moon.position.set(2.6, 0.15, 0);
    moonPivot.add(moon);
    def.moonPivot = moonPivot;

    const moonOrbit = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(
        Array.from({ length: 96 }, (_, i) => {
          const a = i / 96 * Math.PI * 2;
          return new THREE.Vector3(Math.cos(a) * 2.6, 0.15, Math.sin(a) * 2.6);
        })
      ),
      new THREE.LineBasicMaterial({ color: 0x3a5a8a, transparent: true, opacity: 0.35 })
    );
    holder.add(moonOrbit);
    orbitLines.push(moonOrbit);
  }

  if (def.hasRings) {
    const inner = def.size * 1.35, outer = def.size * 2.35;
    const rg = new THREE.RingGeometry(inner, outer, 128, 1);
    const pos = rg.attributes.position, uv = rg.attributes.uv, v3 = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v3.fromBufferAttribute(pos, i);
      uv.setXY(i, (v3.length() - inner) / (outer - inner), 0.5);
    }
    const ring = new THREE.Mesh(rg, new THREE.MeshLambertMaterial({
      map: ringTexture(), transparent: true, side: THREE.DoubleSide, depthWrite: false, emissive: 0x14120c
    }));
    ring.rotation.x = -Math.PI / 2;
    tiltG.add(ring);
    def.ringMesh = ring;
  }

  const orbitLine = makeOrbitLine(def);
  scene.add(orbitLine);
  orbitLines.push(orbitLine);

  labels.push(addLabel(holder, def.key, def.size + 1.6));

  planets.push({ def, holder, mesh });
}

/* ---------------- 星空与小行星带 ---------------- */
{
  const N = 2600;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const rand = mulberry32(1234);
  for (let i = 0; i < N; i++) {
    const v = new THREE.Vector3(rand() * 2 - 1, rand() * 2 - 1, rand() * 2 - 1).normalize().multiplyScalar(900 + rand() * 1300);
    pos.set([v.x, v.y, v.z], i * 3);
    const b = 0.7 + rand() * 0.3, warm = rand();
    col.set([b * (0.85 + warm * 0.15), b * 0.9, b * (1.05 - warm * 0.15)], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    size: 2.2, map: dotTex, transparent: true, depthWrite: false,
    sizeAttenuation: false, vertexColors: true
  })));
}
const belt = new THREE.Group();
{
  const N = 2400;
  const pos = new Float32Array(N * 3);
  const rand = mulberry32(5678);
  for (let i = 0; i < N; i++) {
    const r = 44 + (rand() + rand()) * 8;       // 44 ~ 60,中间更密
    const a = rand() * Math.PI * 2;
    pos.set([Math.cos(a) * r, (rand() - 0.5) * 2.2, Math.sin(a) * r], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  belt.add(new THREE.Points(g, new THREE.PointsMaterial({
    size: 0.5, map: dotTex, transparent: true, depthWrite: false,
    color: 0x8a7f70, sizeAttenuation: true, opacity: 0.85
  })));
  scene.add(belt);
}

/* ---------------- 状态与交互 ---------------- */
let simDays = 0;
let playing = true;
let speedVal = 5;
let followObj = null;      // 跟随的天体(sun 或 holder)
let followPrev = new THREE.Vector3();
let zooming = false, targetDist = 0;
let resetting = false;
let selectedDef = null;    // null | 'sun' | def
let colorTarget = null;    // 当前调色的目标('sun' 或 def)
const SUN_DEFAULT_TINT = '#fff1d0';
let sunTint = SUN_DEFAULT_TINT;

// 换色:行星直接给贴图叠色,太阳连带光照与光晕一起变
function applyPlanetTint(def, hex) {
  def.tint = hex;
  const p = planets.find(p => p.def === def);
  if (!p) return;
  p.mesh.material.color.set(hex);
  if (def.ringMesh) def.ringMesh.material.color.set(hex);
}
function applySunTint(hex) {
  sunTint = hex;
  sun.material.color.set(hex).multiplyScalar(1.35);
  glow.material.color.set(hex);
  sunLight.color.set(hex);
}

const _v = new THREE.Vector3();

const $ = id => document.getElementById(id);
const timeEl = $('timePanel'), card = $('infoCard');
const colorPick = $('colorPick'), colorReset = $('colorReset');

if (IS_TOUCH) $('hint').textContent = '单指拖动旋转 · 双指缩放 · 点按行星查看详情';
let useBloom = !IS_MOBILE;
const qualityChk = $('qualityChk');
qualityChk.checked = useBloom;
qualityChk.onchange = () => useBloom = qualityChk.checked;

function showCard(def) {
  selectedDef = def;
  const isSun = def === 'sun';
  const info = isSun ? SUN_INFO : def.info;
  $('infoName').textContent = isSun ? SUN_INFO.name : def.key;
  $('infoEn').textContent = isSun ? SUN_INFO.en : def.en;
  $('infoRows').innerHTML = info.rows.map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
  $('infoFact').textContent = info.fact;
  colorTarget = def;
  colorPick.value = isSun ? sunTint : (def.tint || '#ffffff');
  card.classList.remove('hidden');
}
function hideCard() {
  hideCardInternal();
  followObj = null;
  zooming = false;
  document.querySelectorAll('#planetBar button').forEach(b => b.classList.remove('active'));
}
function select(target) {
  resetting = false;
  hideCardInternal();
  if (target === 'sun') {
    followObj = sun;
    showCard('sun');
    targetDist = 30;
  } else {
    followObj = target.holder;
    showCard(target.def);
    targetDist = target.def.size * 7 + 3;
    target.mesh.material.emissive.setHex(0x1a2038);
  }
  followPrev.copy(followObj.position);
  zooming = true;
  markActiveButton(target);
}
function hideCardInternal() {
  selectedDef = null;
  colorTarget = null;
  card.classList.add('hidden');
  for (const p of planets) p.mesh.material.emissive.setHex(0x000000);
  applySunTint(sunTint);
}

// 行星快捷按钮
const planetBar = $('planetBar');
const overviewBtn = document.createElement('button');
overviewBtn.textContent = '🌌 总览';
overviewBtn.onclick = () => {
  hideCard();
  resetting = true;
  markActiveButton(null);
};
planetBar.appendChild(overviewBtn);
for (const p of planets) {
  const b = document.createElement('button');
  b.textContent = p.def.key;
  b.onclick = () => select(p);
  planetBar.appendChild(b);
}
const sunBtn = document.createElement('button');
sunBtn.textContent = '☀ 太阳';
sunBtn.onclick = () => select('sun');
planetBar.appendChild(sunBtn);

function markActiveButton(target) {
  const btns = planetBar.querySelectorAll('button');
  btns.forEach(b => b.classList.remove('active'));
  if (!target) { btns[0].classList.add('active'); return; } // 总览
  const key = target === 'sun' ? '☀ 太阳' : target.def.key;
  btns.forEach(b => { if (b.textContent === key) b.classList.add('active'); });
}
markActiveButton(null);

// 点击拾取(区分拖拽)
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(clickables, false)[0];
  if (!hit) return;
  if (hit.object.userData.isSun) select('sun');
  else {
    const p = planets.find(p => p.mesh === hit.object);
    if (p) select(p);
  }
});
renderer.domElement.addEventListener('pointermove', e => {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  renderer.domElement.style.cursor = raycaster.intersectObjects(clickables, false).length ? 'pointer' : 'grab';
});

// 控制面板
const playBtn = $('playBtn'), speedInput = $('speed'), speedLabel = $('speedVal');
playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
};
speedInput.oninput = () => {
  speedVal = +speedInput.value;
  speedLabel.textContent = `${speedVal} 天/秒`;
};
$('orbitsChk').onchange = e => orbitLines.forEach(l => l.visible = e.target.checked);
$('labelsChk').onchange = e => labels.forEach(l => l.visible = e.target.checked);
$('beltChk').onchange = e => belt.visible = e.target.checked;
$('resetBtn').onclick = () => { hideCard(); resetting = true; markActiveButton(null); };
$('closeCard').onclick = () => { hideCard(); resetting = true; markActiveButton(null); };
colorPick.oninput = () => {
  if (!colorTarget) return;
  if (colorTarget === 'sun') applySunTint(colorPick.value);
  else applyPlanetTint(colorTarget, colorPick.value);
};
colorReset.onclick = () => {
  if (!colorTarget) return;
  const hex = colorTarget === 'sun' ? SUN_DEFAULT_TINT : '#ffffff';
  colorPick.value = hex;
  if (colorTarget === 'sun') applySunTint(hex);
  else applyPlanetTint(colorTarget, hex);
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let lastDay = -1;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (playing) simDays += speedVal * dt;

  for (const p of planets) {
    orbitalPos(p.def, simDays, p.holder.position);
    p.mesh.rotation.y = simDays * 24 / p.def.dayHours * Math.PI * 2;
    if (p.def.cloudsMesh) p.def.cloudsMesh.rotation.y = p.mesh.rotation.y * 1.12;
    if (p.def.moonPivot) p.def.moonPivot.rotation.y = simDays / 27.32 * Math.PI * 2;
  }
  belt.rotation.y = simDays / 2000 * Math.PI * 2;

  // 跟随选中天体
  if (followObj) {
    _v.copy(followObj.position).sub(followPrev);
    camera.position.add(_v);
    controls.target.copy(followObj.position);
    followPrev.copy(followObj.position);
    if (zooming) {
      _v.copy(camera.position).sub(controls.target);
      const d = _v.length();
      const nd = d + (targetDist - d) * 0.08;
      _v.setLength(nd);
      camera.position.copy(controls.target).add(_v);
      if (Math.abs(nd - targetDist) < 0.05) zooming = false;
    }
  } else if (resetting) {
    controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.08);
    camera.position.lerp(CAM_DEFAULT, 0.08);
    if (camera.position.distanceTo(CAM_DEFAULT) < 0.5) resetting = false;
  }

  const y = Math.floor(simDays / 365.25), dd = Math.floor(simDays % 365.25);
  const key = y * 1000 + dd;
  if (key !== lastDay) {
    lastDay = key;
    timeEl.textContent = `模拟时间:${y} 年 ${dd} 天`;
  }

  controls.update();
  if (useBloom) composer.render(); else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
